<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank you for participating in the Old Mutual Pulse Culture Survey</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #009677 0%, #8DC63F 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .completion-container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            padding: 50px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .completion-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 150, 119, 0.05) 0%, transparent 70%);
            pointer-events: none;
        }

        .success-icon {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #009677 0%, #8DC63F 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            animation: successPulse 2s ease-in-out infinite;
            position: relative;
            z-index: 1;
        }

        .success-icon .material-icons {
            font-size: 60px;
            color: white;
        }

        @keyframes successPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .completion-title {
            font-size: 32px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }

        .completion-subtitle {
            font-size: 18px;
            color: #7f8c8d;
            margin-bottom: 40px;
            line-height: 1.6;
            position: relative;
            z-index: 1;
        }

        .confirmation-details {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 40px;
            border: 1px solid #e9ecef;
            position: relative;
            z-index: 1;
        }

        .confirmation-details h3 {
            font-size: 20px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .detail-item {
            text-align: left;
        }

        .detail-label {
            font-size: 14px;
            font-weight: 500;
            color: #6c757d;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-value {
            font-size: 16px;
            font-weight: 600;
            color: #2c3e50;
        }

        .confirmation-number {
            background: linear-gradient(135deg, #009677 0%, #8DC63F 100%);
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .next-steps {
            background: #e8f5e8;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
            text-align: left;
            border: 1px solid #c3e6c3;
            position: relative;
            z-index: 1;
        }

        .next-steps h4 {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .next-steps ul {
            list-style: none;
            padding-left: 0;
        }

        .next-steps li {
            padding: 8px 0;
            color: #495057;
            line-height: 1.5;
            position: relative;
            padding-left: 25px;
        }

        .next-steps li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: #009677;
            font-weight: bold;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Montserrat', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, #009677 0%, #8DC63F 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 150, 119, 0.3);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .appreciation-note {
            margin-top: 30px;
            padding: 20px;
            background: rgba(0, 150, 119, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(0, 150, 119, 0.1);
            position: relative;
            z-index: 1;
        }

        .appreciation-note p {
            color: #495057;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .appreciation-note .signature {
            font-weight: 600;
            color: #009677;
            margin-top: 15px;
        }

        @media (max-width: 768px) {
            .completion-container {
                padding: 30px 25px;
            }

            .details-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .action-buttons {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 100%;
                max-width: 300px;
            }
        }

        .print-receipt {
            margin-top: 20px;
            font-size: 14px;
            color: #6c757d;
        }

        .print-link {
            color: #009677;
            text-decoration: underline;
            cursor: pointer;
        }

        .print-link:hover {
            color: #007d65;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }
            
            .completion-container {
                box-shadow: none;
                border: 1px solid #ddd;
            }
            
            .action-buttons, .print-receipt {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="completion-container">
        <div class="success-icon">
            <span class="material-icons">check_circle</span>
        </div>
        
        <h1 class="completion-title">Survey Successfully Completed!</h1>
        <p class="completion-subtitle">
            Thank you for participating in the Old Mutual Pulse Culture Survey. Your valuable feedback will help us improve our workplace culture and create a better environment for everyone.
        </p>
    
    </div>
</body>
</html>
