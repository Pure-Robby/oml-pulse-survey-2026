<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse Survey Admin Dashboard</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</head>
<body data-current-page="overview">
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <div class="loading-text">Updating dashboard...</div>
        </div>
    </div>
    
    <div class="container">
        <header>
            <!-- Logo, Navigation, and Header Actions will be created by navigation.js -->
        </header>

        <main>
            <!-- Page content goes here -->
            <section class="content-section active">
                <div class="section-header">
                    <div class="page-title">
                        <h1>Page Title</h1>
                        <p class="section-description">Page description goes here</p>
                    </div>
                </div>
                
                <!-- Page content -->
                <div class="page-content">
                    <!-- Your page-specific content goes here -->
                </div>
            </section>
        </main>
    </div>
    
    <!-- Scripts -->
    <script src="navigation.js"></script>
    <script src="config.js"></script>
    <script src="data.js"></script>
    <script src="app.js"></script>
    
    <!-- Page-specific scripts can be added here -->
    <script>
        // Page-specific initialization
        document.addEventListener('DOMContentLoaded', function() {
            // Set the current page for navigation
            const currentPage = document.body.dataset.currentPage;
            if (window.pulseNavigation && currentPage) {
                window.pulseNavigation.updateCurrentPage(currentPage);
            }
            
            // Add any page-specific functionality here
        });
    </script>
</body>
</html>
